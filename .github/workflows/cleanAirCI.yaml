name: CI Clean Air

on:
  push:
    branches:
      - cloud-database

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  CI-FRONTEND:
    name: CI - Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/teste-mcp

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/teste-mcp/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

  CI-BACKEND:
    name: CI - Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Subir backend e validar health
        run: |
          node src/index.js &
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://localhost:${{ secrets.PORT }}/api/health
        env:
          PORT: ${{ secrets.PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}

  CI-STATUS:
    name: CI - Status Final
    runs-on: ubuntu-latest
    needs:
      - CI-FRONTEND
      - CI-BACKEND

    steps:
      - name: OK
        run: echo "CI aprovada com sucesso"
